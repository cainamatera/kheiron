name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: 'c-cpp'
        queries: +security-and-quality

    - name: Build Kheiron
      run: |
        gcc -std=c99 -O2 -Wall -Wextra -I. examples/quickstart.c -o kheiron_cli -lm -pthread
        gcc -std=c99 -O2 -Wall -Wextra -I. bench_tests.c -o bench_tests -lm -pthread

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:c-cpp"
