name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [gcc, clang]
        std: [c99, c11]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW on Windows (GCC)
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      - name: Setup MinGW on Windows (Clang)
        if: runner.os == 'Windows' && matrix.compiler == 'clang'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-make

      - name: Compile and Test (POSIX)
        if: runner.os != 'Windows'
        run: |
          ${{ matrix.compiler }} -std=${{ matrix.std }} -O2 -Wall -Wextra -Wpedantic -Werror bench_tests.c -o bench_tests -lm -pthread
          ./bench_tests --quick
          make check CC=${{ matrix.compiler }}
          make sanitizer CC=${{ matrix.compiler }}

      - name: Compile and Test (Windows MinGW)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ${{ matrix.compiler }} -std=${{ matrix.std }} -O2 -Wall -Wextra -Wpedantic -Werror bench_tests.c -o bench_tests.exe -lm -pthread -lbcrypt
          ./bench_tests.exe --quick
